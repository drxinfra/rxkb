name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: hack/leakcheck.sh
        env:
          LEAKCHECK_PATTERN: ${{ secrets.LEAKCHECK_PATTERN }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Включая сборку тестовой базы из testdata/site и сверку с testdata/kb.json (нужен python3, он есть в раннере).
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
      # Уязвимости в бинарнике и в образе: HIGH/CRITICAL с исправлением валят сборку.
      - run: hack/install-trivy.sh && echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: hack/vulncheck.sh
      - run: docker build -t rxkb:ci . && docker save rxkb:ci -o /tmp/rxkb-image.tar
      - run: hack/vulncheck.sh /tmp/rxkb-image.tar
