name: registry
# Публикация server.json в официальный MCP Registry. Только вручную (Actions → registry → Run workflow):
# запись в каталоге публичная, решение о ней принимает человек. Вход через OIDC GitHub, секреты
# не нужны: право на имя io.github.drxinfra/* подтверждает сам репозиторий.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Сервер отвечает
        run: |
          curl -sSf -m 20 https://drxinfra.ru/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | head -c 300
      - name: Установка mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
