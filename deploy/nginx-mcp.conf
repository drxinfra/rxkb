# Пример для nginx: https://<сайт>/mcp → rxkb на 127.0.0.1:8790.
#
# 1. Зоны лимитов, уровень http (например, /etc/nginx/conf.d/30-mcp.conf):
#
#    limit_req_zone  $binary_remote_addr zone=mcp_req:10m rate=2r/s;
#    limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;
#    limit_req_status 429;
#    limit_conn_status 429;
#
# 2. Этот блок внутри server { ... } сайта, include-ом.
#
# Отказы лимитов пишутся уровнем warn: при уровне журнала ошибок error их там нет, и джейл
# fail2ban по limiting requests на /mcp не реагирует (несколько агентов за одним NAT не закрывают
# себе весь сайт). Флуд всё равно получает 429 от nginx и до сервиса не доходит.
location = /mcp {
    limit_req zone=mcp_req burst=30 nodelay;
    limit_req_log_level warn;
    limit_conn mcp_conn 8;
    limit_conn_log_level warn;

    client_max_body_size 128k;
    client_body_buffer_size 128k;
    client_body_timeout 15s;

    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
}
