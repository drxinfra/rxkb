<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Тестовый чек-лист</title></head>

  </fieldset>
  <fieldset class="fs phase" id="ph2">

    <p>Порядок с репетиции.</p>
    <label class="ck"><input type="checkbox" name="c4"><span class="box"></span><span class="t">Закрыть вход</span></label>
    <label class="ck"><input type="checkbox" name="c5"><span class="box"></span><span class="t">Сделать бэкап<small>Базы и хранилища</small></span></label>
  </fieldset>
